# ============================================================
#  Ejecuta las dos suites de pruebas en cada push y pull request.
#
#  Backend y frontend van en trabajos separados y en paralelo: si falla
#  uno, el otro sigue y ves los dos resultados de una vez en lugar de
#  arreglar, empujar y descubrir el siguiente.
# ============================================================
name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

jobs:

  backend:
    # Sin el numero de pruebas en el nombre: se queda obsoleto en cuanto se
    # anade una, y un nombre que miente es peor que uno generico.
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar JDK 17
        uses: actions/setup-java@v4
        with:
          # La misma versión que declara el pom. Spring Boot 3.3.5 es
          # anterior a los JDK más nuevos y con ellos falla de formas
          # difíciles de diagnosticar.
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar las pruebas
        working-directory: BackendTienda
        # Las pruebas no necesitan MySQL: las de repositorio corren sobre
        # H2 en memoria y el resto usa dobles.
        run: ./mvnw --batch-mode test

      - name: Publicar los informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: BackendTienda/target/surefire-reports/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          # Node 24, la misma version con la que se desarrolla.
          #
          # Con Node 20 el paso fallaba: su npm 10 rechazaba el
          # package-lock.json generado por el npm 11 de Node 24, porque
          # resuelven el arbol de dependencias de forma distinta. El lock
          # estaba bien; lo que no encajaba eran las dos versiones de npm.
          #
          # La integracion continua debe correr sobre lo mismo que la maquina
          # de desarrollo, o comprueba una combinacion que nadie usa.
          node-version: '24'
          cache: npm
          cache-dependency-path: Practica/package-lock.json

      # npm ci instala exactamente lo que fija el lockfile, sin
      # actualizar nada: es lo que garantiza que la integración pruebe la
      # misma combinación de versiones que tienes en tu máquina.
      - name: Instalar dependencias
        working-directory: Practica
        # Si npm falla, su mensaje se publica como anotacion del flujo.
        # Sin esto, el fallo llega como un escueto "exit code 1" y hay que
        # entrar al registro completo para saber que paso.
        #
        # El if no es adorno: GitHub ejecuta cada run con "bash -e", asi que
        # una forma tipo "npm ci && exit 0" aborta el script en cuanto npm
        # falla y nunca llega a publicar el mensaje. Dentro de un if, bash
        # no aplica -e y el fallo si se puede capturar.
        run: |
          if npm ci 2>&1 | tee npm-salida.log; then
            exit 0
          fi
          echo "::error title=Fallo npm ci::$(grep -iE 'npm (error|warn EBADENGINE)' npm-salida.log | head -25 | tr '\n' '|' | cut -c1-1500)"
          exit 1

      # Karma no trae navegador: lanza el que encuentre en el sistema. En
      # local usa el Chrome instalado, pero en el runner hay que decirle
      # cual es, y el nombre del ejecutable cambia entre imagenes. Sin esto
      # el paso moria con codigo 127 (orden no encontrada) sin mas pista.
      - name: Localizar el navegador para Karma
        run: |
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            ruta=$(command -v "$b" || true)
            if [ -n "$ruta" ]; then
              echo "CHROME_BIN=$ruta" >> "$GITHUB_ENV"
              echo "Karma usara: $ruta"
              exit 0
            fi
          done
          echo "::error title=Sin navegador::El runner no tiene Chrome ni Chromium; Karma no puede ejecutar las pruebas."
          exit 1

      - name: Ejecutar las pruebas
        working-directory: Practica
        run: |
          if npm run test:ci 2>&1 | tee pruebas.log; then
            exit 0
          fi
          echo "::error title=Fallo en las pruebas del frontend::$(grep -iE 'error|failed|cannot|no such' pruebas.log | head -20 | tr '\n' '|' | cut -c1-1500)"
          exit 1

      - name: Comprobar que compila para producción
        working-directory: Practica
        # Compilar con la configuración de producción detecta errores que
        # el modo desarrollo deja pasar, como un environment mal resuelto.
        run: |
          if npm run build 2>&1 | tee compilacion.log; then
            exit 0
          fi
          echo "::error title=Fallo la compilacion::$(grep -iE 'error|not found|ENOENT|cannot' compilacion.log | head -20 | tr '\n' '|' | cut -c1-1500)"
          exit 1
