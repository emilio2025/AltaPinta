<header class="ap-cabecera">
  <div class="ap-cabecera__barra">
    <a class="ap-logo" (click)="irMenu()">ALTA<span>PINTA</span></a>

    <nav class="ap-nav">
      <button type="button" *ngFor="let c of categorias"
              class="ap-nav__enlace" (click)="irCategoria(c.nombre)">
        {{ c.nombre }}
      </button>
    </nav>

    <div class="ap-cabecera__acciones">
      <button type="button" class="ap-icono" (click)="irFavoritos()" aria-label="Favoritos">
        <i class="pi pi-heart"></i>
      </button>
      <button type="button" class="ap-icono" (click)="irCarrito()" aria-label="Carrito">
        <i class="pi pi-shopping-bag"></i>
      </button>
      <button type="button" class="ap-boton ap-boton--fantasma ap-boton--pequeno" (click)="cerrarSesion()">
        Salir
      </button>
    </div>
  </div>
</header>

<div class="ap-cuenta">

  <nav class="ap-cuenta__nav">
    <button type="button" class="ap-cuenta__enlace ap-cuenta__enlace--activo">
      <i class="pi pi-user"></i> Mi perfil
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irPedidos()">
      <i class="pi pi-box"></i> Mis pedidos
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irDirecciones()">
      <i class="pi pi-map-marker"></i> Direcciones
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irTarjetas()">
      <i class="pi pi-credit-card"></i> Tarjetas
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irFavoritos()">
      <i class="pi pi-heart"></i> Favoritos
    </button>
  </nav>

  <main class="ap-cuenta__panel">
    <div class="ap-cuenta__cabecera">
      <div>
        <span class="ap-etiqueta">Tu cuenta</span>
        <h1 class="ap-titulo-seccion">Mi perfil</h1>
      </div>
      <button type="button" class="ap-boton ap-boton--pequeno"
              *ngIf="cliente && !editando"
              (click)="editar()">
        <i class="pi pi-pencil"></i> Editar
      </button>
    </div>

    <div class="ap-cargando" *ngIf="!cliente && !errorCarga">
      <i class="pi pi-spinner pi-spin"></i> Cargando tu perfil...
    </div>

    <div class="ap-cuenta__vacio" *ngIf="errorCarga">
      <i class="pi pi-exclamation-triangle"></i>
      <h2>No se pudo cargar tu perfil</h2>
      <p>{{ errorCarga }}</p>
      <button type="button" class="ap-boton ap-boton--acento" (click)="cerrarSesion()">
        Iniciar sesión
      </button>
    </div>

    <div class="ap-panel" *ngIf="cliente">

      <!-- El correo no se edita: identifica la cuenta -->
      <div class="ap-perfil__correo">
        <span class="ap-etiqueta">Correo de la cuenta</span>
        <strong>{{ cliente.correo }}</strong>
      </div>

      <div class="ap-rejilla-campos">
        <div class="ap-campo">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" [(ngModel)]="cliente.nombre"
                 name="nombre" [disabled]="!editando">
        </div>

        <div class="ap-campo">
          <label for="dni">DNI</label>
          <input id="dni" type="text" [(ngModel)]="cliente.dni"
                 name="dni" [disabled]="!editando">
        </div>

        <div class="ap-campo ap-campo--ancho">
          <label for="direccion">Dirección</label>
          <input id="direccion" type="text" [(ngModel)]="cliente.direccion"
                 name="direccion" [disabled]="!editando">
        </div>

        <div class="ap-campo">
          <label for="ruc">RUC <span class="ap-campo__opcional">opcional</span></label>
          <input id="ruc" type="text" [(ngModel)]="cliente.ruc"
                 name="ruc" [disabled]="!editando">
        </div>

        <div class="ap-campo">
          <label for="razonSocial">Razón social <span class="ap-campo__opcional">opcional</span></label>
          <input id="razonSocial" type="text" [(ngModel)]="cliente.razonSocial"
                 name="razonSocial" [disabled]="!editando">
        </div>
      </div>

      <div class="ap-perfil__acciones" *ngIf="editando">
        <button type="button" class="ap-boton ap-boton--acento"
                [disabled]="cargando" (click)="guardar()">
          <i class="pi" [ngClass]="cargando ? 'pi-spinner pi-spin' : 'pi-check'"></i>
          {{ cargando ? 'Guardando...' : 'Guardar cambios' }}
        </button>
      </div>

    </div>
  </main>
</div>
