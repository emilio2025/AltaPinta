<header class="ap-cabecera">
  <div class="ap-cabecera__barra">
    <a class="ap-logo" (click)="irMenu()">ALTA<span>PINTA</span></a>

    <nav class="ap-nav">
      <button type="button" *ngFor="let c of categorias"
              class="ap-nav__enlace" (click)="irCategoria(c.nombre)">
        {{ c.nombre }}
      </button>
    </nav>

    <div class="ap-cabecera__acciones">
      <button type="button" class="ap-icono" (click)="irFavoritos()" aria-label="Favoritos">
        <i class="pi pi-heart"></i>
      </button>
      <button type="button" class="ap-icono" (click)="irCarrito()" aria-label="Carrito">
        <i class="pi pi-shopping-bag"></i>
        <span class="ap-contador" *ngIf="contadorCarrito > 0">{{ contadorCarrito }}</span>
      </button>
      <button type="button" class="ap-icono" (click)="irPerfil()" aria-label="Mi perfil">
        <i class="pi pi-user"></i>
      </button>
      <button type="button" class="ap-boton ap-boton--fantasma ap-boton--pequeno" (click)="cerrarSesion()">
        Salir
      </button>
    </div>
  </div>
</header>

<div class="ap-cuenta">

  <nav class="ap-cuenta__nav">
    <button type="button" class="ap-cuenta__enlace" (click)="irPerfil()">
      <i class="pi pi-user"></i> Mi perfil
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irPedidos()">
      <i class="pi pi-box"></i> Mis pedidos
    </button>
    <button type="button" class="ap-cuenta__enlace ap-cuenta__enlace--activo">
      <i class="pi pi-map-marker"></i> Direcciones
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irTarjetas()">
      <i class="pi pi-credit-card"></i> Tarjetas
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irFavoritos()">
      <i class="pi pi-heart"></i> Favoritos
    </button>
  </nav>

  <main class="ap-cuenta__panel">
    <div class="ap-cuenta__cabecera">
      <div>
        <span class="ap-etiqueta">Tu cuenta</span>
        <h1 class="ap-titulo-seccion">Direcciones</h1>
      </div>
      <button type="button" class="ap-boton ap-boton--pequeno"
              *ngIf="!mostrarFormulario"
              (click)="nueva()">
        <i class="pi pi-plus"></i> Añadir dirección
      </button>
    </div>

    <!-- Formulario -->
    <div class="ap-panel ap-direcciones__form" *ngIf="mostrarFormulario">
      <h2 class="ap-direcciones__form-titulo">
        {{ modoEdicion ? 'Editar dirección' : 'Nueva dirección' }}
      </h2>

      <div class="ap-rejilla-campos">
        <div class="ap-campo">
          <label for="etiqueta">Etiqueta</label>
          <input id="etiqueta" type="text" [(ngModel)]="direccion.etiqueta"
                 name="etiqueta" placeholder="Casa, trabajo...">
        </div>

        <div class="ap-campo">
          <label for="distrito">Distrito</label>
          <input id="distrito" type="text" [(ngModel)]="direccion.distrito" name="distrito">
        </div>

        <div class="ap-campo ap-campo--ancho">
          <label for="direccionCompleta">Dirección</label>
          <input id="direccionCompleta" type="text"
                 [(ngModel)]="direccion.direccionCompleta" name="direccionCompleta"
                 placeholder="Calle, número, urbanización">
        </div>

        <div class="ap-campo ap-campo--ancho">
          <label for="referencia">Referencia <span class="ap-campo__opcional">opcional</span></label>
          <input id="referencia" type="text" [(ngModel)]="direccion.referencia"
                 name="referencia" placeholder="Frente al parque, portón azul...">
        </div>
      </div>

      <p class="ap-mensaje-error" *ngIf="mensajeError">
        <i class="pi pi-exclamation-circle"></i> {{ mensajeError }}
      </p>

      <div class="ap-direcciones__acciones">
        <button type="button" class="ap-boton ap-boton--acento" (click)="guardar()">
          <i class="pi pi-check"></i> {{ modoEdicion ? 'Guardar cambios' : 'Añadir' }}
        </button>
        <button type="button" class="ap-boton ap-boton--fantasma" (click)="cancelar()">
          Cancelar
        </button>
      </div>
    </div>

    <div class="ap-cargando" *ngIf="cargando">
      <i class="pi pi-spinner pi-spin"></i> Cargando direcciones...
    </div>

    <!-- Sin direcciones -->
    <div class="ap-cuenta__vacio" *ngIf="!cargando && direcciones.length === 0 && !mostrarFormulario">
      <i class="pi pi-map-marker"></i>
      <h2>No tienes direcciones guardadas</h2>
      <p>Añade una para agilizar tus próximos pedidos.</p>
      <button type="button" class="ap-boton ap-boton--acento" (click)="nueva()">
        Añadir dirección
      </button>
    </div>

    <!-- Listado -->
    <div class="ap-direcciones" *ngIf="direcciones.length > 0">
      <article class="ap-direccion" *ngFor="let d of direcciones">
        <div class="ap-direccion__datos">
          <span class="ap-direccion__etiqueta" *ngIf="d.etiqueta">{{ d.etiqueta }}</span>
          <strong>{{ d.direccionCompleta }}</strong>
          <span class="ap-direccion__distrito" *ngIf="d.distrito">{{ d.distrito }}</span>
          <span class="ap-direccion__referencia" *ngIf="d.referencia">{{ d.referencia }}</span>
        </div>

        <div class="ap-direccion__acciones">
          <button type="button" class="ap-icono" (click)="editar(d)" aria-label="Editar">
            <i class="pi pi-pencil"></i>
          </button>
          <button type="button" class="ap-icono ap-icono--peligro"
                  (click)="eliminar(d.id)" aria-label="Eliminar">
            <i class="pi pi-trash"></i>
          </button>
        </div>
      </article>
    </div>
  </main>
</div>
