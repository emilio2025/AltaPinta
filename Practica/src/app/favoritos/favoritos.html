<header class="ap-cabecera">
  <div class="ap-cabecera__barra">
    <a class="ap-logo" (click)="irMenu()">ALTA<span>PINTA</span></a>

    <nav class="ap-nav">
      <button type="button" *ngFor="let c of categorias"
              class="ap-nav__enlace" (click)="irCategoria(c.nombre)">
        {{ c.nombre }}
      </button>
    </nav>

    <div class="ap-cabecera__acciones">
      <button type="button" class="ap-icono" (click)="irFavoritos()" aria-label="Favoritos">
        <i class="pi pi-heart"></i>
      </button>
      <button type="button" class="ap-icono" (click)="irCarrito()" aria-label="Carrito">
        <i class="pi pi-shopping-bag"></i>
      </button>
      <button type="button" class="ap-icono" (click)="irPerfil()" aria-label="Mi perfil">
        <i class="pi pi-user"></i>
      </button>
      <button type="button" class="ap-boton ap-boton--fantasma ap-boton--pequeno" (click)="CerrarSesion()">
        Salir
      </button>
    </div>
  </div>
</header>

<div class="ap-cuenta">

  <!-- Navegación de cuenta -->
  <nav class="ap-cuenta__nav">
    <button type="button" class="ap-cuenta__enlace" (click)="irPerfil()">
      <i class="pi pi-user"></i> Mi perfil
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irPedidos()">
      <i class="pi pi-box"></i> Mis pedidos
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irDirecciones()">
      <i class="pi pi-map-marker"></i> Direcciones
    </button>
    <button type="button" class="ap-cuenta__enlace" (click)="irTarjetas()">
      <i class="pi pi-credit-card"></i> Tarjetas
    </button>
    <button type="button" class="ap-cuenta__enlace ap-cuenta__enlace--activo">
      <i class="pi pi-heart"></i> Favoritos
    </button>
  </nav>

  <main class="ap-cuenta__panel">
    <div class="ap-cuenta__cabecera">
      <div>
        <span class="ap-etiqueta">Tu cuenta</span>
        <h1 class="ap-titulo-seccion">Favoritos</h1>
      </div>
      <span class="ap-etiqueta" *ngIf="favoritos.length">
        {{ favoritos.length }} {{ favoritos.length === 1 ? 'producto' : 'productos' }}
      </span>
    </div>

    <!-- Sin favoritos -->
    <div class="ap-cuenta__vacio" *ngIf="favoritos.length === 0">
      <i class="pi pi-heart"></i>
      <h2>Todavía no tienes favoritos</h2>
      <p>Guarda las prendas que te gusten para encontrarlas rápido.</p>
      <button type="button" class="ap-boton ap-boton--acento" (click)="irMenu()">
        Ver catálogo
      </button>
    </div>

    <!-- Cuadrícula -->
    <div class="ap-cuadricula" *ngIf="favoritos.length > 0">
      <article class="ap-producto" *ngFor="let p of favoritos" (click)="verDetalle(p)">
        <div class="ap-producto__imagen">
          <span class="ap-insignia" *ngIf="p.deporte">{{ p.deporte.nombre }}</span>

          <button type="button" class="ap-favorito ap-favorito--activo"
                  (click)="quitar(p); $event.stopPropagation()"
                  aria-label="Quitar de favoritos">
            <i class="pi pi-heart-fill"></i>
          </button>

          <img [src]="p.imagenUrl" [alt]="p.nombre"
               onerror="this.src='assets/altaPinta.jpg'; this.onerror=null;">

          <div class="ap-producto__acciones">
            <button type="button" class="ap-producto__accion"
                    (click)="verDetalle(p); $event.stopPropagation()">
              Ver producto
            </button>
          </div>
        </div>

        <div class="ap-producto__info">
          <h3 class="ap-producto__nombre">{{ p.nombre }}</h3>
          <div class="ap-producto__precio">S/ {{ p.precio }}</div>
        </div>
      </article>
    </div>
  </main>
</div>
