<div class="ap-acceso">

  <aside class="ap-acceso__marca">
    <a class="ap-logo ap-logo--claro" routerLink="/principal">ALTA<span>PINTA</span></a>
    <h1 class="ap-acceso__lema">Recupera<br>tu acceso</h1>
    <p class="ap-acceso__texto">
      Te enviamos un código a tu correo para que puedas establecer una
      contraseña nueva.
    </p>
  </aside>

  <main class="ap-acceso__panel">
    <div class="ap-acceso__caja">

      <span class="ap-etiqueta">Paso 1 de 2</span>
      <h2 class="ap-acceso__titulo">¿Olvidaste tu contraseña?</h2>

      <form (ngSubmit)="enviar()" novalidate>

        <div class="ap-campo">
          <label for="correo">Correo de tu cuenta</label>
          <input id="correo" type="email"
                 [(ngModel)]="correo"
                 name="correo"
                 required
                 autocomplete="email"
                 placeholder="tucorreo@ejemplo.com">
        </div>

        <p class="ap-acceso__error" *ngIf="error">
          <i class="pi pi-exclamation-circle"></i> {{ error }}
        </p>

        <p class="ap-acceso__aviso" *ngIf="message">
          <i class="pi pi-check-circle"></i> {{ message }}
        </p>

        <button type="submit" class="ap-boton ap-boton--acento ap-boton--bloque">
          <i class="pi pi-envelope"></i> Enviarme el código
        </button>
      </form>

      <a class="ap-acceso__volver" routerLink="/login">
        <i class="pi pi-arrow-left"></i> Volver al inicio de sesión
      </a>

    </div>
  </main>
</div>
