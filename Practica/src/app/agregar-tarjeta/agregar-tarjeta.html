<!-- ============================================================
     Alta de tarjeta
     Columna única centrada, igual que el checkout: aquí la única
     acción útil es completar el formulario.
     ============================================================ -->

<div class="ap-alta">
  <div class="ap-alta__caja">

    <header class="ap-alta__cabecera">
      <span class="ap-etiqueta">Métodos de pago</span>
      <h1 class="ap-alta__titulo">Nueva tarjeta</h1>
    </header>

    <form #formTarjeta="ngForm" (ngSubmit)="guardar(formTarjeta)" novalidate>

      <div class="ap-campo">
        <label for="numero">Número de tarjeta</label>
        <input id="numero" type="text" inputmode="numeric"
               [(ngModel)]="numero"
               name="numero"
               required
               pattern="^[0-9]{16}$"
               maxlength="16"
               placeholder="16 dígitos"
               #numeroCtrl="ngModel">
        <span class="ap-campo__error"
              *ngIf="numeroCtrl.invalid && numeroCtrl.touched">
          Debe tener exactamente 16 dígitos.
        </span>
      </div>

      <div class="ap-campo">
        <label for="titular">Titular</label>
        <input id="titular" type="text"
               [(ngModel)]="titular"
               name="titular"
               required
               placeholder="Como aparece en la tarjeta">
      </div>

      <div class="ap-rejilla-campos">
        <div class="ap-campo">
          <label for="fecha">Vencimiento</label>
          <input id="fecha" type="text"
                 [(ngModel)]="fechaVencimiento"
                 name="fechaVencimiento"
                 required
                 pattern="^(0[1-9]|1[0-2])\/[0-9]{4}$"
                 placeholder="MM/AAAA"
                 #fechaCtrl="ngModel">
          <span class="ap-campo__error"
                *ngIf="fechaCtrl.invalid && fechaCtrl.touched">
            Usa el formato MM/AAAA.
          </span>
        </div>

        <div class="ap-campo">
          <label for="cvv">CVV</label>
          <input id="cvv" type="text" inputmode="numeric"
                 [(ngModel)]="cvv"
                 name="cvv"
                 required
                 pattern="^[0-9]{3}$"
                 maxlength="3"
                 placeholder="3 dígitos"
                 #cvvCtrl="ngModel">
          <span class="ap-campo__error"
                *ngIf="cvvCtrl.invalid && cvvCtrl.touched">
            Deben ser 3 dígitos.
          </span>
        </div>
      </div>

      <!-- El CVV se valida pero no se envía ni se guarda: PCI DSS lo
           prohíbe. Se avisa para que no parezca un olvido. -->
      <p class="ap-alta__aviso">
        <i class="pi pi-shield"></i>
        El CVV solo se usa para validar el formato. No se envía ni se
        almacena en ningún momento.
      </p>

      <p class="ap-campo__error ap-campo__error--bloque" *ngIf="error">
        <i class="pi pi-exclamation-circle"></i> {{ error }}
      </p>

      <button type="submit" class="ap-boton ap-boton--acento ap-boton--bloque"
              [disabled]="loading">
        <i class="pi" [ngClass]="loading ? 'pi-spinner pi-spin' : 'pi-check'"></i>
        {{ loading ? 'Guardando...' : 'Guardar tarjeta' }}
      </button>

      <button type="button" class="ap-boton ap-boton--fantasma ap-boton--bloque"
              (click)="volver()">
        <i class="pi pi-arrow-left"></i> Volver
      </button>

    </form>
  </div>
</div>
