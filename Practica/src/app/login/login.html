<!-- ============================================================
     Inicio de sesión
     Dos paneles: marca a la izquierda, formulario a la derecha.
     ============================================================ -->

<div class="ap-acceso">

  <!-- Panel de marca -->
  <aside class="ap-acceso__marca">
    <a class="ap-logo ap-logo--claro" routerLink="/principal">ALTA<span>PINTA</span></a>
    <h1 class="ap-acceso__lema">Entrena<br>sin excusas</h1>
    <p class="ap-acceso__texto">
      Accede a tu cuenta para ver tus pedidos, tus favoritos y completar
      tus compras.
    </p>
  </aside>

  <!-- Formulario -->
  <main class="ap-acceso__panel">
    <div class="ap-acceso__caja">

      <span class="ap-etiqueta">Bienvenido de vuelta</span>
      <h2 class="ap-acceso__titulo">Iniciar sesión</h2>

      <form (ngSubmit)="onLoginSubmit()" #loginForm="ngForm" novalidate>

        <div class="ap-campo">
          <label for="correo">Correo</label>
          <input id="correo" type="email"
                 [(ngModel)]="loginData.correo"
                 name="correo"
                 required
                 autocomplete="email"
                 placeholder="tucorreo@ejemplo.com">
        </div>

        <div class="ap-campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password"
                 [(ngModel)]="loginData.password"
                 name="password"
                 required
                 autocomplete="current-password"
                 placeholder="Tu contraseña">
        </div>

        <a class="ap-acceso__olvido" routerLink="/forgot-password">
          ¿Olvidaste tu contraseña?
        </a>

        <p class="ap-acceso__error" *ngIf="errorMessage">
          <i class="pi pi-exclamation-circle"></i> {{ errorMessage }}
        </p>

        <button type="submit" class="ap-boton ap-boton--acento ap-boton--bloque">
          <i class="pi pi-sign-in"></i> Entrar
        </button>
      </form>

      <div class="ap-acceso__separador"><span>o</span></div>

      <button type="button" class="ap-boton ap-boton--fantasma ap-boton--bloque"
              routerLink="/register">
        Crear una cuenta
      </button>

      <a class="ap-acceso__volver" routerLink="/principal">
        <i class="pi pi-arrow-left"></i> Volver a la tienda
      </a>

    </div>
  </main>
</div>
