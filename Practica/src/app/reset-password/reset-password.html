<div class="ap-acceso">

  <aside class="ap-acceso__marca">
    <a class="ap-logo ap-logo--claro" routerLink="/principal">ALTA<span>PINTA</span></a>
    <h1 class="ap-acceso__lema">Nueva<br>contraseña</h1>
    <p class="ap-acceso__texto">
      Introduce el código que te enviamos y elige una contraseña nueva.
    </p>
  </aside>

  <main class="ap-acceso__panel">
    <div class="ap-acceso__caja">

      <span class="ap-etiqueta">Paso 2 de 2</span>
      <h2 class="ap-acceso__titulo">Cambiar contraseña</h2>

      <form (ngSubmit)="cambiar()" novalidate>

        <div class="ap-campo">
          <label for="codigo">Código recibido</label>
          <input id="codigo" type="text" inputmode="numeric"
                 [(ngModel)]="codigo"
                 name="codigo"
                 required
                 autocomplete="one-time-code"
                 placeholder="El código de tu correo">
        </div>

        <div class="ap-campo">
          <label for="password">Contraseña nueva</label>
          <input id="password" type="password"
                 [(ngModel)]="password"
                 name="password"
                 required
                 minlength="8"
                 pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                 autocomplete="new-password"
                 #passwordField="ngModel">
          <!-- Mismo criterio que valida el backend en PasswordValidator -->
          <span class="ap-campo__ayuda"
                [class.ap-campo__ayuda--error]="passwordField.invalid && passwordField.touched">
            Mínimo 8 caracteres, una mayúscula, una minúscula y un número.
          </span>
        </div>

        <p class="ap-acceso__error" *ngIf="error">
          <i class="pi pi-exclamation-circle"></i> {{ error }}
        </p>

        <p class="ap-acceso__aviso" *ngIf="message">
          <i class="pi pi-check-circle"></i> {{ message }}
        </p>

        <button type="submit" class="ap-boton ap-boton--acento ap-boton--bloque">
          <i class="pi pi-lock"></i> Guardar contraseña
        </button>
      </form>

      <a class="ap-acceso__volver" routerLink="/login">
        <i class="pi pi-arrow-left"></i> Volver al inicio de sesión
      </a>

    </div>
  </main>
</div>
