<!-- ============================================================
     Checkout
     Una sola columna centrada: aquí el objetivo es que no haya
     distracciones y el pago se complete.
     ============================================================ -->

<div class="ap-checkout">
  <div class="ap-checkout__caja">

    <header class="ap-checkout__cabecera">
      <span class="ap-etiqueta">Último paso</span>
      <h1 class="ap-checkout__titulo">Pago</h1>
      <p class="ap-checkout__texto">Revisa el método de pago y confirma tu pedido.</p>
    </header>

    <!-- ---------- Pago completado ---------- -->
    <div class="ap-checkout__exito" *ngIf="exito">
      <i class="pi pi-check-circle"></i>
      <h2>Pago realizado</h2>
      <p *ngIf="pedidoResponse">
        Entrega estimada: <strong>{{ pedidoResponse.tiempoEntrega }}</strong>
      </p>
    </div>

    <!-- ---------- Formulario ---------- -->
    <form (ngSubmit)="pagar()" #form="ngForm" *ngIf="!exito">

      <div class="ap-campo">
        <label for="tarjeta">Método de pago</label>
        <select id="tarjeta"
                [(ngModel)]="tarjetaSeleccionada"
                name="tarjeta"
                required>
          <option [ngValue]="null">Selecciona una tarjeta</option>
          <option *ngFor="let t of tarjetas" [ngValue]="t">
            {{ t?.marca || 'Tarjeta' }} ···· {{ t?.numero?.slice(-4) }} — S/ {{ t?.saldo | number:'1.2-2' }}
          </option>
        </select>
      </div>

      <button type="button" class="ap-checkout__nueva" (click)="AgregarTarjeta()">
        <i class="pi pi-plus"></i> Añadir una tarjeta nueva
      </button>

      <div class="ap-checkout__total">
        <span>Total a pagar</span>
        <strong>S/ {{ total | number:'1.2-2' }}</strong>
      </div>

      <button type="submit" class="ap-boton ap-boton--acento ap-boton--bloque"
              [disabled]="loading || !tarjetaSeleccionada">
        <i class="pi" [ngClass]="loading ? 'pi-spinner pi-spin' : 'pi-lock'"></i>
        {{ loading ? 'Procesando...' : 'Confirmar pedido' }}
      </button>

      <p class="ap-checkout__error" *ngIf="error">
        <i class="pi pi-exclamation-circle"></i> {{ error }}
      </p>

      <button type="button" class="ap-boton ap-boton--fantasma ap-boton--bloque" (click)="volver()">
        <i class="pi pi-arrow-left"></i> Volver al carrito
      </button>
    </form>

    <p class="ap-checkout__pie">
      <i class="pi pi-shield"></i> Pago protegido · Datos cifrados
    </p>

  </div>
</div>
