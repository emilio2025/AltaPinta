# ============================================================
#  AltaPinta - Configuracion de la aplicacion
#
#  Este archivo SI se versiona: no contiene ningun secreto.
#  Los valores sensibles se leen de variables de entorno con la
#  sintaxis ${NOMBRE_VARIABLE}.
#
#  Para desarrollo local no hace falta crear variables de entorno
#  del sistema: basta con el archivo BackendTienda/secrets.properties
#  (ver secrets.properties.example). Ese archivo esta en .gitignore.
#
#  Precedencia (gana el ultimo):
#    application.properties  <  secrets.properties  <  variables de entorno
#  Asi, en tu maquina usas secrets.properties y en un servidor real
#  puedes sobrescribir todo con variables de entorno sin tocar codigo.
# ============================================================

# Carga secrets.properties si existe. El prefijo "optional:" evita que
# la aplicacion falle al arrancar cuando el archivo no esta presente.
spring.config.import=optional:file:./secrets.properties

# ---------- Base de datos MySQL ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:alta_pinta}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# ---------- Correo (SMTP) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- JWT ----------
# Sin valor por defecto a proposito: si falta JWT_SECRET la aplicacion
# no arranca, en lugar de firmar tokens con una clave conocida.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- Cuenta administradora ----------
# Al registrarse con este correo, el cliente recibe ROLE_ADMIN.
app.admin.correo=${ADMIN_EMAIL}

# ---------- Varios ----------
spring.jackson.serialization.fail-on-empty-beans=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
